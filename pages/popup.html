<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summaryse</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1E293B;
    }
    .popup-container {
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1E293B;
    }
    p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .shortcut {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #475569;
      margin-bottom: 12px;
      border-left: 3px solid #0ea5a8;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1E293B;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background: #0f172a;
    }
    .version {
      font-size: 11px;
      color: #cbd5e1;
      text-align: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <h1>Summaryse</h1>
    <p>Summarize any text on the web using local AI.</p>

    <div class="shortcut">
      <strong>Keyboard shortcut:</strong><br>
      Mac: <code>Cmd+Shift+S</code><br>
      Windows/Linux: <code>Ctrl+Shift+S</code>
    </div>

    <button onclick="openOnboarding()">Learn More</button>

    <div class="version">
      Version 1.0.0
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
