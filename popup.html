<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summaryse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 500px;
      background: #fff;
      color: #202124;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 90vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e8eaed;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 500;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #5f6368;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover { color: #202124; }

    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    #summary {
      font-size: 14px;
      line-height: 1.6;
      color: #202124;
      word-break: break-word;
      flex: 1;
      overflow-y: auto;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 100px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e0e0e0;
      border-top: 2px solid #1f73e6;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loadingText {
      font-size: 13px;
      color: #5f6368;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      padding-top: 8px;
      border-top: 1px solid #e8eaed;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: #f3f3f3;
      color: #202124;
    }

    button:hover { background: #e8e8e8; }

    #summarizeBtn {
      background: #1f73e6;
      color: white;
      align-self: stretch;
    }

    #summarizeBtn:hover:not(:disabled) { background: #1765cc; }

    #summarizeBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Summaryse</h1>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>

    <div class="content">
      <!-- Summary Text -->
      <div id="summary" style="display: none;"></div>

      <!-- Loading State -->
      <div class="loading" id="loading" style="display: none;">
        <div class="spinner"></div>
        <p id="loadingText">Summarizing...</p>
      </div>

      <!-- Error Message -->
      <div class="error" id="error" style="display: none;"></div>

      <!-- Summarize Button (shown on initial load) -->
      <button id="summarizeBtn" style="display: none;">Summarize</button>
    </div>

    <!-- Action Buttons (Copy, New) -->
    <div class="actions" id="actions" style="display: none;">
      <button id="copyBtn">📋 Copy</button>
      <button id="newSummarizeBtn">↻ New</button>
    </div>
  </div>

  <script src="webllm-npm.js"></script>
  <script type="module" src="init.js"></script>
</body>
</html>
